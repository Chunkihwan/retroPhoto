<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <filter id="paperNoise">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.11"/>
      </feComponentTransfer>
    </filter>
    <pattern id="dotPattern" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="3.2" fill="#292620" opacity="0.82"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#f3f0e6"/>
  <rect x="56" y="52" width="1088" height="526" fill="#fbf7e9"/>
  <rect x="56" y="52" width="1088" height="526" fill="#24201a" opacity="0.05" filter="url(#paperNoise)"/>

  <g transform="translate(720 118)">
    <rect x="0" y="0" width="330" height="330" fill="#f8f2df"/>
    <rect x="0" y="0" width="330" height="330" fill="url(#dotPattern)"/>
    <circle cx="165" cy="142" r="68" fill="#f8f2df" opacity="0.74"/>
    <path d="M86 302c18-73 66-113 79-113s61 40 79 113z" fill="#f8f2df" opacity="0.7"/>
    <path d="M88 106c43-63 116-66 154 0 18 31 13 66-5 89-33-38-113-38-146 0-20-27-21-58-3-89z" fill="#f8f2df" opacity="0.72"/>
    <rect x="22" y="24" width="98" height="12" fill="#f8f2df" opacity="0.8"/>
    <rect x="22" y="50" width="144" height="8" fill="#f8f2df" opacity="0.58"/>
  </g>

  <g transform="translate(120 124)">
    <text x="0" y="0" fill="#7d2f3b" font-family="Geist Mono, Menlo, monospace" font-size="26" font-weight="700" letter-spacing="5">
      RETRO DOT PHOTO
    </text>
    <text x="0" y="96" fill="#24201a" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="90" font-weight="900">
      레트로 사진관
    </text>
    <text x="2" y="158" fill="#4c4336" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="33" font-weight="700">
      사진을 옛날 신문 느낌의 도트 이미지로
    </text>
    <text x="2" y="204" fill="#4c4336" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="33" font-weight="700">
      빠르게 바꿔주는 브라우저 앱
    </text>
    <g transform="translate(2 282)">
      <rect width="140" height="48" fill="#24201a"/>
      <text x="70" y="32" text-anchor="middle" fill="#fbf7e9" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="20" font-weight="800">
        먹색
      </text>
      <rect x="156" width="140" height="48" fill="#fbf7e9" stroke="#24201a" stroke-width="2"/>
      <text x="226" y="32" text-anchor="middle" fill="#24201a" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="20" font-weight="800">
        6px 도트
      </text>
      <rect x="312" width="168" height="48" fill="#fbf7e9" stroke="#24201a" stroke-width="2"/>
      <text x="396" y="32" text-anchor="middle" fill="#24201a" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="20" font-weight="800">
        PNG 저장
      </text>
    </g>
  </g>
</svg>
