<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Body -->
  <rect x="1" y="9" width="30" height="18" rx="2" fill="#2a261f"/>
  <rect x="1" y="9" width="30" height="4" rx="2" fill="#3a352c"/>
  <!-- Top plate -->
  <rect x="5" y="6" width="22" height="4" rx="1" fill="#24201a"/>
  <!-- Shutter button -->
  <circle cx="9" cy="7" r="1.8" fill="#8d3440"/>
  <!-- Film advance knob -->
  <rect x="22" y="5" width="5" height="5" rx="1" fill="#3a352c"/>
  <rect x="23" y="6" width="3" height="3" rx="0.5" fill="#4a4238"/>
  <!-- Viewfinder -->
  <rect x="5" y="12" width="7" height="5" rx="0.5" fill="#151210"/>
  <rect x="6" y="13" width="5" height="3" rx="0.3" fill="#2a4a58"/>
  <!-- Lens outer ring -->
  <circle cx="20" cy="19" r="7.5" fill="#1a1714"/>
  <!-- Lens ring detail -->
  <circle cx="20" cy="19" r="6.5" fill="#2a261f"/>
  <circle cx="20" cy="19" r="5.5" fill="#151210"/>
  <!-- Lens glass -->
  <circle cx="20" cy="19" r="4" fill="#1e1a14"/>
  <!-- Lens reflection -->
  <circle cx="18.2" cy="17.2" r="1.3" fill="rgba(255,255,255,0.18)"/>
  <circle cx="21.5" cy="21" r="0.6" fill="rgba(255,255,255,0.08)"/>
  <!-- Bottom detail -->
  <rect x="3" y="24" width="4" height="2" rx="0.5" fill="#3a352c"/>
</svg>
